[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qcflows-api"
version = "0.1.0"
description = "Minimal QCFlows API for pairwise quantum correlation metrics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "gunicorn>=26.0.0",
  "numpy",
  "httpx>=0.27.0",
  "qiskit>=2.4.0",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
