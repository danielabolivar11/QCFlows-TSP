[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qcflows-api"
version = "0.1.0"
description = "Minimal QCFlows API for K-matrix computation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"" = "qcflows_api"
